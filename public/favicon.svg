<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded Background Box matching the header icon -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" />

  <!-- Sun Rays & Core (Sun behind cloud) -->
  <g transform="translate(62, 38)" filter="url(#shadow)">
    <!-- Sun Ray Accents -->
    <line x1="0" y1="-18" x2="0" y2="-23" stroke="#FBBF24" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="13" y1="-13" x2="17" y2="-17" stroke="#FBBF24" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="18" y1="0" x2="23" y2="0" stroke="#FBBF24" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="13" y1="13" x2="17" y2="17" stroke="#FBBF24" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-13" y1="-13" x2="-17" y2="-17" stroke="#FBBF24" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Sun Body -->
    <circle cx="0" cy="0" r="14" fill="url(#sunGrad)" />
  </g>

  <!-- Weather Cloud (in front of sun) -->
  <g filter="url(#shadow)">
    <path d="M34 68 H68 C74.627 68 80 62.627 80 56 C80 49.638 75.038 44.437 68.796 44.032 C67.438 33.722 58.658 26 48 26 C38.318 26 30.22 32.324 27.876 41.229 C21.282 42.146 16 47.933 16 55 C16 62.18 21.82 68 29 68 Z" fill="url(#cloudGrad)" />
  </g>
</svg>
